<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEAK POINT | Acesso</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="container">
      <section class="left">
        <div class="brand">
          <div class="brand-icon"><img src="imagens/pp.png"></div>
          <span>PEAK POINT</span>
        </div>
        <div class="brand-content">
          <h1>Supere seus limites.<br /><span>Conquiste o seu Topo.</span></h1>
          <p>
            Encontre os equipamentos certos para suas aventuras e prepare-se
            para explorar novas alturas.
          </p>
      </section>

      <section class="right">
        <div class="form-container">
          <div class="mobile-brand">PEAK POINT</div>

          <div class="buttons">
            <button type="button" id="loginBtn" class="active">Login</button>
            <button type="button" id="registerBtn">Cadastro</button>
          </div>

          <form id="loginForm">
            <div class="form-heading">
              <h2>Bem-vindo de volta!</h2>
              <p>Entre na sua conta para continuar.</p>
            </div>

            <label for="loginEmail">E-mail</label>
            <input
              type="email"
              id="loginEmail"
              placeholder="email@exemplo.com"
              autocomplete="email"
              required
            />

            <label for="loginSenha">Senha</label>
            <input
              type="password"
              id="loginSenha"
              placeholder="digite sua senha"
              autocomplete="current-password"
              required
            />

            <button type="submit" class="submit-btn">Entrar</button>
          </form>

          <form id="registerForm" class="hidden">
            <div class="form-heading">
              <h2>Cadastrar</h2>
              <p>Prepare-se para sua próxima aventura.</p>
            </div>

            <label for="cadastroNome">Nome</label>
            <input
              type="text"
              id="cadastroNome"
              placeholder="nome ou apelido"
              autocomplete="name"
              required
            />

            <label for="cadastroEmail">E-mail</label>
            <input
              type="email"
              id="cadastroEmail"
              placeholder="email@exemplo.com"
              autocomplete="email"
              required
            />

            <label for="cadastroSenha">Senha</label>
            <input
              type="password"
              id="cadastroSenha"
              placeholder="Crie uma senha"
              autocomplete="new-password"
              minlength="6"
              required
            />

            <button type="submit" class="submit-btn">Criar conta</button>
          </form>
        </div>
      </section>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
